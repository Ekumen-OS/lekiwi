[project]
name = "lerobot_teleoperator_lekiwi_keyboard"
version = "0.1.0"
license = "Apache-2.0"
license-files = ["LICENSE"]
authors = [{ name = "Franco Cipollone", email = "franco.c@ekumenlabs.com"}]
description = "LeRobot third-party teleoperator plugin: full keyboard teleoperation (base + arm) for the LeKiwi robot."
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "lerobot>=0.4.0",
    "numpy>=1.24.0",
]

[build-system]
requires = ["setuptools"]
build-backend = "setuptools.build_meta"

[dependency-groups]
dev = ["pytest >=8.1.1", "ruff >=0.9.1"]
